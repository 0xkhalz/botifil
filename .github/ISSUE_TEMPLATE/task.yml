name: Agent Task
description: Delegation packet for autonomous agent tasks
labels: ["status:ready"]
body:
  - type: input
    id: parent-issue
    attributes:
      label: Parent Issue
      description: Parent issue reference (e.g., #12).
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: owned-files
    attributes:
      label: Owned Files
      description: Exact allowlist of files this task is authorized to touch.
      placeholder: |
        - path/to/file1
        - path/to/file2
    validations:
      required: true
  - type: textarea
    id: slice-boundary
    attributes:
      label: Slice Boundary
      description: Single small, focused deliverable for one logical scope.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
      description: Explicit boundaries, files, or subsystems not to touch.
    validations:
      required: true
  - type: input
    id: verifier-command
    attributes:
      label: Verifier Command
      description: Command that must exit 0 for this task to be complete.
      value: "scripts/verify.sh"
    validations:
      required: true
  - type: checkboxes
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Invariants that must be satisfied before completion.
      options:
        - label: "All owned files exist and changes stay focused on one logical scope"
          required: true
        - label: "Verifier command runs and passes cleanly (exit code 0)"
          required: true
        - label: "No unapproved dependencies, secrets, or personal paths"
          required: true
