name: Bug Report
description: Report a bug or unexpected behavior in botifil
labels: ["type:fix"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual behavior
      description: Describe what happened and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Steps to reliably reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment/version
      description: OS, Rust version, botifil commit or version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Relevant logs or terminal output (optional; redact all sensitive data).
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: security-privacy
    attributes:
      label: Security & Privacy
      options:
        - label: "I redacted all bot tokens, private group IDs, and personal info"
          required: true
