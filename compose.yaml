services:
  botifil:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      BOTIFIL_WEBAPP_BIND: "0.0.0.0:8080"
      BOTIFIL_DB_PATH: "/data/botifil.redb"
    volumes:
      - "./data:/data"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      - botifil
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
